<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Meetup Plaza</title>
<style>
:root{--card:#ffffffee;--tx:#1d2a3a;--pri:#ff5a36;--acc:#2f80ff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#1e2633ee;--tx:#eef3fa}}
:root[data-theme="dark"]{--card:#1e2633ee;--tx:#eef3fa}
html,body{height:100%;margin:0;overflow:hidden;background:#8fd3ff;font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:auto}#start .box{backdrop-filter:blur(10px);box-shadow:0 18px 50px #0003}#st,#hud,.rb,#cin,.pn{backdrop-filter:blur(8px)}
button{font:inherit;cursor:pointer}
.ui{position:fixed;z-index:3;visibility:hidden}body.on .ui{visibility:visible}
#st{top:calc(8px + env(safe-area-inset-top,0px));left:8px;background:var(--card);color:var(--tx);padding:6px 12px;border-radius:16px;font-weight:700}
#em{top:calc(8px + env(safe-area-inset-top,0px));right:8px;display:flex;flex-direction:column;gap:8px}
.rb{width:52px;height:52px;border-radius:50%;border:0;background:var(--card);font-size:24px;box-shadow:0 2px 8px #0004;padding:0}
#js{left:18px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;background:#ffffff55;border:2px solid #ffffffaa}
#kn{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#ffffffd0}
#jp{right:18px;bottom:calc(30px + env(safe-area-inset-bottom,0px));width:76px;height:76px;font-size:15px;font-weight:800;background:var(--pri);color:#fff}
#cb{right:30px;bottom:calc(118px + env(safe-area-inset-bottom,0px))}
#log{left:10px;bottom:calc(158px + env(safe-area-inset-bottom,0px));max-width:72%;pointer-events:none}
#log div{background:#000a;color:#fff;padding:4px 10px;border-radius:12px;margin-top:4px;width:fit-content}
#cin{position:fixed;z-index:6;left:0;right:0;bottom:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);display:flex;gap:8px;box-sizing:border-box}
#cin[hidden]{display:none}
#cin input{flex:1;min-width:0;padding:12px;border-radius:12px;border:1px solid #8886;font:inherit;background:transparent;color:var(--tx);user-select:text;-webkit-user-select:text}
#cin button,#go{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 18px;font-weight:700}
#start{position:fixed;inset:0;z-index:9;background:linear-gradient(#5ec2ff,#b6ecff);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
#start .box{background:var(--card);color:var(--tx);border-radius:22px;padding:22px;max-width:360px;width:100%;text-align:center;box-sizing:border-box}
#start h1{margin:0 0 4px;font-size:28px}#start p{margin:4px 0 12px;opacity:.8}
#nm{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid #8886;font:inherit;text-align:center;background:transparent;color:var(--tx);user-select:text;-webkit-user-select:text}
#sw i{display:inline-block;width:34px;height:34px;border-radius:8px;margin:6px 4px;border:3px solid transparent}#sw i.on{border-color:var(--tx)}
#go{width:100%;font-size:17px;margin-top:6px}
#inv2{width:100%;margin-top:8px;background:#1877f2;color:#fff;border:0;border-radius:12px;padding:12px;font-weight:700;font-size:15px}
#hud{top:calc(48px + env(safe-area-inset-top,0px));left:8px;background:var(--card);color:var(--tx);padding:6px 12px;border-radius:16px;font-weight:700}
#sk{top:calc(8px + env(safe-area-inset-top,0px));right:68px;display:flex;flex-direction:column;gap:8px}
#sk .rb{position:relative;font-size:22px;line-height:1}#sk .rb small{position:absolute;bottom:3px;left:0;right:0;font-size:10px;font-weight:700}#sk .rb:disabled{opacity:.5}
#sb{left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--pri);color:#fff;border:0;border-radius:20px;padding:12px 20px;font-weight:800;box-shadow:0 2px 8px #0005}#sb:not(.show){display:none}
#shp,#mk{position:fixed;inset:0;z-index:8;background:#000a;display:flex;align-items:center;justify-content:center;padding:12px}#shp[hidden],#mk[hidden]{display:none}
.pn input{width:100%;box-sizing:border-box;padding:10px;margin-top:6px;border-radius:10px;border:1px solid #8886;font:inherit;background:transparent;color:var(--tx);user-select:text;-webkit-user-select:text}.lc{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #8883}.lc img{width:84px;height:84px;object-fit:cover;border-radius:10px;flex:none}.lc button,#mkL>button,.fm button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-weight:700;margin-top:4px}
.pn{background:var(--card);color:var(--tx);border-radius:18px;padding:16px;width:min(100%,400px);max-height:86vh;overflow:auto}.pn h2{margin:0 0 8px;font-size:20px}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #8883}.it small{opacity:.7}
.it button,#shX{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 12px;font-weight:700;min-width:84px}.it button:disabled{opacity:.45}
#gd{display:flex;gap:8px;margin:8px 0}#gd button{flex:1;padding:12px;border-radius:12px;border:3px solid transparent;background:#8882;color:var(--tx);font-weight:700;font-size:16px}#gd button.on{border-color:var(--tx)}
#mu{top:calc(92px + env(safe-area-inset-top,0px));left:8px;width:44px;height:44px;font-size:20px}
</style></head><body>
<canvas id="cv"></canvas>
<div class="ui" id="st"></div>
<div class="ui" id="em"><button class="rb" data-e="1">👋</button><button class="rb" data-e="2">💃</button><button class="rb" data-e="3">🌀</button><button class="rb" id="inv" style="background:#1877f2">📘</button></div>
<div class="ui" id="log"></div>
<button class="ui rb" id="mu">🔊</button><div class="ui" id="hud">🪙 <b id="cc">0</b></div>
<div class="ui" id="sk"><button class="rb" data-k="sprint">⚡<small></small></button><button class="rb" data-k="jump">🦘<small></small></button><button class="rb" data-k="glide">🪂<small></small></button></div>
<button class="ui" id="sb">🛒 Enter shop</button>
<div id="mk" hidden><div class="pn"><h2 id="mkT"></h2><div id="mkL"></div><button id="mkX" style="width:100%;margin-top:10px;background:#8884;color:var(--tx);border:0;border-radius:10px;padding:10px;font-weight:700">Close</button></div></div>
<div id="shp" hidden><div class="pn"><h2 id="shT"></h2><div id="shL"></div><button id="shX" style="width:100%;margin-top:10px">Close</button></div></div>
<div class="ui" id="js"><div id="kn"></div></div>
<button class="ui rb" id="cb">💬</button><button class="ui rb" id="jp">JUMP</button>
<div id="cin" hidden><input id="ci" maxlength="72" placeholder="Say something…" autocomplete="off"><button id="cs">Send</button></div>
<div id="start"><div class="box"><h1>🌴 Meetup Plaza</h1><p>Hang out with friends in a 3D world</p>
<input id="nm" maxlength="14" placeholder="Your name"><div id="gd"><button data-g="m">👨 Man</button><button data-g="f">👩 Woman</button></div><div id="sw"></div><button id="go">Enter world</button><button id="inv2">📘 Invite Facebook friends</button>
<p style="font-size:12px;margin-top:12px">Walk, chat, wave and dance. Friends you invite show up live.</p></div></div>

for(let i=0;i<12;i++){const G=new T.Group(),a=new T.Mesh(wg,bmat),b=new T.Mesh(wg,bmat);b.scale.x=-1;G.add(a,b);G.scale.setScalar(1.8+Math.random()*1.2);sc.add(G);birds.push({G,a,b,r:20+Math.random()*70,h:14+Math.random()*22,s:(.06+Math.random()*.08)*(i%2?1:-1),p:Math.random()*6.3,f:6+Math.random()*4,o:Math.random()*6})}
function wild(t,dt){for(const c of cars){c.a+=c.sg*c.v/c.r*dt;c.g.position.set(Math.cos(c.a)*c.r,0,Math.sin(c.a)*c.r);c.g.rotation.y=Math.atan2(-Math.sin(c.a)*c.sg,Math.cos(c.a)*c.sg)}
 for(const a of animals){const p=a.g.position;if(t>a.nt){a.nt=t+3+Math.random()*6;const g=Math.random()*6.28,r=8+Math.random()*32;a.gx=Math.cos(g)*r;a.gz=Math.sin(g)*r}
  const dx=a.gx-p.x,dz=a.gz-p.z,d=Math.hypot(dx,dz);a.mv=d>.8?1:0;if(a.mv){p.x+=dx/d*a.sp*dt;p.z+=dz/d*a.sp*dt;a.g.rotation.y=la(a.g.rotation.y,Math.atan2(dx,dz),Math.min(1,dt*6));a.ph+=dt*9}
  for(const c of cols){const ex=p.x-c.x,ez=p.z-c.z,e=Math.hypot(ex,ez),m=c.r+.9;if(e<m&&e>.001){p.x=c.x+ex/e*m;p.z=c.z+ez/e*m}}
  a.legs.forEach((l,i)=>l.rotation.x=a.mv?Math.sin(a.ph+(i==0||i==3?0:Math.PI))*.7:0);if(a.tail)a.tail.rotation.y=Math.sin(t*(a.mv?10:4))*.35;if(a.head)a.head.rotation.x=a.mv?Math.sin(a.ph*.5)*.06:Math.sin(t*1.3)*.04}
 for(const b of birds){const an=b.p+t*b.s,sg=Math.sign(b.s),w=Math.sin(t*b.f+b.o)*.75;b.G.position.set(Math.cos(an)*b.r,b.h+Math.sin(t*.8+b.o)*1.5,Math.sin(an)*b.r);b.G.rotation.y=Math.atan2(-Math.sin(an)*sg,Math.cos(an)*sg);b.a.rotation.z=w;b.b.rotation.z=-w}}
// ---------- loop ----------
let last=now();
function loop(){requestAnimationFrame(loop);const t=now(),dt=Math.min(.05,t-last);last=t;
 if(me){let ix=jx+(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),iy=jy+(keys.w||keys.ArrowUp?1:0)-(keys.s||keys.ArrowDown?1:0);const l=Math.hypot(ix,iy),mv=l>.1;
  if(mv){if(l>1){ix/=l;iy/=l}const sn=Math.sin(P.cy),cs=Math.cos(P.cy),dx=-sn*iy+cs*ix,dz=-cs*iy-sn*ix;const spd=SPD();P.x+=dx*9*spd*dt;P.z+=dz*9*spd*dt;P.r=la(P.r,Math.atan2(dx,dz),Math.min(1,dt*14))}
  if(jump&&P.y<=.001){P.vy=9;AU.s('hop')}jump=0;P.vy-=26*dt;if(now()<GLT&&P.vy<-2.2)P.vy=-2.2;P.y+=P.vy*dt;if(P.y<0){P.y=0;P.vy=0}
  for(const c of cols){const dx=P.x-c.x,dz=P.z-c.z,d=Math.hypot(dx,dz),m=c.r+.6;if(d<m&&d>.001){P.x=c.x+dx/d*m;P.z=c.z+dz/d*m}}
  const rd=Math.hypot(P.x,P.z);if(rd>46){P.x*=46/rd;P.z*=46/rd}
  me.g.position.set(P.x,P.y,P.z);me.g.rotation.y=P.r;anim(me,mv,dt,t);
  const cp=Math.cos(P.cp);cam.position.set(P.x+Math.sin(P.cy)*P.d*cp,P.y*.5+1.8+Math.sin(P.cp)*P.d,P.z+Math.cos(P.cy)*P.d*cp);cam.lookAt(P.x,P.y+2,P.z);
  if(room&&t>sendT){sendT=t+.1;const o={x:+P.x.toFixed(2),y:+P.y.toFixed(2),z:+P.z.toFixed(2),r:+P.r.toFixed(2),mv:mv?1:0,nm:myName,c:myCol,g:myG,h:myHat},k=JSON.stringify(o);if(k!==lastK){lastK=k;pr(o)}}
 }else{cam.position.set(Math.sin(t*.1)*28,10,Math.cos(t*.1)*28);cam.lookAt(0,3,0)}
 for(const a of rem.values()){const p=a.g.position,k=Math.min(1,dt*10);p.x+=(a.tx-p.x)*k;p.y+=(a.ty-p.y)*k;p.z+=(a.tz-p.z)*k;a.g.rotation.y=la(a.g.rotation.y,a.tr,k);anim(a,a.mv,dt,t)}
 for(const b of bots){if(t>b.nt){b.nt=t+3+Math.random()*5;b.gx=(Math.random()-.5)*34;b.gz=(Math.random()-.5)*34}
  const p=b.g.position,dx=b.gx-p.x,dz=b.gz-p.z,d=Math.hypot(dx,dz);b.mv=d>.6?1:0;
  if(b.mv){p.x+=dx/d*3.2*dt;p.z+=dz/d*3.2*dt;b.g.rotation.y=la(b.g.rotation.y,Math.atan2(dx,dz),Math.min(1,dt*8))}
  const q=Math.hypot(p.x,p.z);if(q<4.8&&q>.01){p.x*=4.8/q;p.z*=4.8/q}
  if(t>b.st){b.st=t+14+Math.random()*14;paintBub(b,LINES[Math.random()*LINES.length|0])}anim(b,b.mv,dt,t)}
 extra(t,dt);wild(t,dt);R.render(sc,cam)}
loop();

// ---------- controls ----------
const js=$('#js'),kn=$('#kn');let jid=null;
const jm=e=>{const r=js.getBoundingClientRect(),dx=e.clientX-(r.left+60),dy=e.clientY-(r.top+60),l=Math.min(1,Math.hypot(dx,dy)/45),a=Math.atan2(dy,dx);jx=Math.cos(a)*l;jy=-Math.sin(a)*l;kn.style.transform=`translate(${Math.cos(a)*l*40}px,${Math.sin(a)*l*40}px)`};
js.onpointerdown=e=>{jid=e.pointerId;js.setPointerCapture(jid);jm(e)};js.onpointermove=e=>{if(e.pointerId==jid)jm(e)};
js.onpointerup=js.onpointercancel=()=>{jid=null;jx=jy=0;kn.style.transform=''};
let dp=null;cv.onpointerdown=e=>{dp={id:e.pointerId,x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(dp&&e.pointerId==dp.id){P.cy-=(e.clientX-dp.x)*.006;P.cp=Math.max(.1,Math.min(1.2,P.cp+(e.clientY-dp.y)*.004));dp.x=e.clientX;dp.y=e.clientY}};
cv.onpointerup=cv.onpointercancel=()=>dp=null;cv.onwheel=e=>P.d=Math.max(4,Math.min(16,P.d+e.deltaY*.01));
$('#jp').onpointerdown=()=>jump=1;
$('#em').onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.e)play(+b.dataset.e)};
async function invite(){const txt="Join me at Meetup Plaza 🌴 Let's hang out in the 3D world!";
 try{if(navigator.share){await navigator.share({title:'Meetup Plaza',text:txt,url:LINK});return}}catch(e){if(e.name=='AbortError')return}
 try{await navigator.clipboard.writeText(txt+' '+LINK);log('Invite link copied! Paste it in Messenger or Facebook')}catch(e){}
 window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(LINK),'_blank')}
$('#inv').onclick=$('#inv2').onclick=invite;
const cin=$('#cin'),ci=$('#ci');
$('#cb').onclick=()=>{cin.hidden=!cin.hidden;if(!cin.hidden)ci.focus()};
const send=()=>{if(ci.value.trim())AU.s('chat');say(ci.value);ci.value='';cin.hidden=true;ci.blur()};$('#cs').onclick=send;
ci.onkeydown=e=>{if(e.key=='Enter')send();if(e.key=='Escape'){cin.hidden=true;ci.blur()}};
const typing=()=>document.activeElement&&document.activeElement.tagName=='INPUT';
addEventListener('keydown',e=>{if(typing())return;if(e.key=='Enter'&&me){cin.hidden=false;ci.focus();e.preventDefault();return}if(e.key==' '){jump=1;e.preventDefault()}keys[e.key.length==1?e.key.toLowerCase():e.key]=1});
addEventListener('keyup',e=>{keys[e.key.length==1?e.key.toLowerCase():e.key]=0});

// ---------- start & room ----------
$('#go').onclick=()=>{myName=($('#nm').value.trim()||'Guest'+(Math.random()*900+100|0)).slice(0,14);try{localStorage.setItem('mp_n',myName);localStorage.setItem('mp_c',myCol);localStorage.setItem('mp_g',myG)}catch(e){}
 me=mkAv(myName,myCol,myG);setHat(me,myHat);hud();me.g.position.set(P.x,0,P.z);$('#start').style.display='none';document.body.classList.add('on');setSt();log('Welcome, '+myName+'! Drag to look around.')};
(async()=>{try{if(window.claude)room=await claude.use('room')}catch(e){room=null}
 if(room){room.onPeers(sync,()=>{})}setSt()})();
</script></body></html>
